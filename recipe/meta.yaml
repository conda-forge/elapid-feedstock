{% set name = "elapid" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c66b138c88d9a60362e020b6a35e490a122f533ca7f39624025bda5976f484a4

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry
  run:
    - python >={{ python_min }}
    - geopandas >=1.0,<2
    - numpy >=1.18,<2
    - pandas >=1.0.3
    - pyproj >=3.0
    - rasterio >=1.2.1
    - rtree >=0.9
    - scikit-learn >=1.2,<1.6
    - tqdm >=4.60
    - matplotlib-base >=3.7

test:
  imports:
    - elapid
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://elapid.org
  dev_url: https://github.com/earth-chris/elapid
  summary: Species distribution modeling support tools
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - earth-chris
